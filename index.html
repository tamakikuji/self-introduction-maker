<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【ゲームキャラ風】自己紹介生成メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2fb; --bg2:#dfe7f8; --surface:#ffffff; --ink:#14224a; --muted:#56668f;
  --line:#c5d0ea; --accent:#2b4fc4; --accent-ink:#ffffff; --star:#b8862b; --chip:#f4f7fe;
  --shadow:0 1px 0 rgba(20,34,74,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090f2b; --bg2:#101a45; --surface:#121b45; --ink:#eaf0ff; --muted:#9dafdc;
    --line:#2b3b78; --accent:#8fb0ff; --accent-ink:#0a1230; --star:#e8c877; --chip:#18235a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#090f2b; --bg2:#101a45; --surface:#121b45; --ink:#eaf0ff; --muted:#9dafdc;
  --line:#2b3b78; --accent:#8fb0ff; --accent-ink:#0a1230; --star:#e8c877; --chip:#18235a;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--bg);
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, var(--star) 50%, transparent 52%),
    radial-gradient(1px 1px at 82% 9%, var(--star) 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 66% 34%, var(--star) 50%, transparent 52%),
    radial-gradient(1px 1px at 30% 62%, var(--star) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 91% 71%, var(--star) 50%, transparent 52%),
    linear-gradient(180deg, var(--bg2) 0, var(--bg) 320px);
  background-repeat:no-repeat;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  line-height:1.75; font-size:16px;
}
.wrap{max-width:560px; margin:0 auto; padding:20px 18px 64px}
header{display:flex; align-items:center; gap:10px; margin-bottom:6px}
header .moon{font-size:26px; color:var(--star); line-height:1}
header h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700; font-size:19px; margin:0; letter-spacing:.06em}
.progress{display:flex; gap:5px; margin:14px 0 22px; align-items:center}
.progress i{font-style:normal; font-size:14px; color:var(--line); transition:color .25s, transform .25s}
.progress i.on{color:var(--star)}
.progress i.now{transform:scale(1.35)}
.progress span{margin-left:auto; font-size:13px; color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 18px; box-shadow:var(--shadow)}
h2{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:24px; line-height:1.5; margin:0 0 4px; letter-spacing:.04em}
h2.nosub{margin-bottom:18px}
.sub{margin:0 0 18px; color:var(--muted); font-size:14px}
label.f{display:block; font-size:14px; color:var(--muted); margin:14px 0 4px}
input[type=text], textarea.wide{
  width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:10px; padding:12px 14px;
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.group-title{font-weight:700; font-size:15px; margin:18px 0 8px}
.group-title:first-of-type{margin-top:0}
.group-title.lg{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; letter-spacing:.06em; margin:22px 0 10px}
.group-title.lg:first-of-type{margin-top:0}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  font:inherit; font-size:15px; color:var(--ink); background:var(--chip); border:1px solid var(--line);
  border-radius:999px; padding:9px 15px; cursor:pointer; min-height:44px; line-height:1.3; text-align:left;
  transition:background .15s, color .15s, border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip:focus-visible, .btn:focus-visible, .star:focus-visible, .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.add{display:flex; gap:8px; margin:0 0 14px}
.add input{flex:1}
.btn{
  font:inherit; font-size:16px; font-weight:700; border-radius:999px; border:1px solid var(--accent);
  background:var(--accent); color:var(--accent-ink); padding:12px 24px; cursor:pointer; min-height:48px;
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.small{padding:8px 16px; min-height:44px; font-size:14px}
.nav{display:flex; gap:10px; justify-content:space-between; margin-top:20px}
.nav .btn.next{margin-left:auto}
.nav.top{margin:0 0 14px}
.hint{font-size:13px; color:var(--muted); margin-top:10px}
.stats{display:grid; gap:0}
.stat{padding:10px 0; border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat input[type=text]{padding:9px 12px; font-size:15px}
.stars{display:flex; margin-top:2px}
.star{background:none; border:0; padding:4px 2px; font-size:28px; line-height:1; color:var(--line); cursor:pointer; min-width:40px; min-height:44px}
.star.on{color:var(--star)}
.stat .r{display:flex; gap:8px; align-items:center}
.stat .r input{flex:1}
.btn:disabled{opacity:.45; cursor:default}
.lastbox{margin-top:14px; padding:14px; border:1px dashed var(--star); border-radius:12px}
.lastbox .ttl{font-weight:700; font-size:15px; margin-bottom:6px}
textarea.wide{min-height:96px; resize:vertical; line-height:1.6}
.tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.tab{font:inherit; font-size:14px; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer; min-height:44px}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
textarea.doc{
  width:100%; font:inherit; font-size:14px; line-height:1.7; color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:10px; padding:14px; resize:vertical; min-height:340px;
}
textarea.doc[readonly]{cursor:default}
.row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center}
.seg{display:flex; gap:6px; margin:0 0 10px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.tip{margin-top:16px; padding:12px 14px; border-left:3px solid var(--star); background:var(--chip); border-radius:0 10px 10px 0; font-size:14px}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="moon" aria-hidden="true">☾</span><h1>【ゲームキャラ風】自己紹介生成メーカー</h1></header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function h(tag, props){
  var e = document.createElement(tag);
  var p = props || {};
  Object.keys(p).forEach(function(k){
    var v = p[k];
    if(k === "class") e.className = v;
    else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
    else if(k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    kids.forEach(function(c){
      if(c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
  }
  return e;
}
var toastTimer;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function copyText(text){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("コピーしました"); }
    catch(e){ toast("長押しでコピーしてください"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("コピーしました"); }, fallback);
  } else fallback();
}

/* ---------- kana -> romaji ---------- */
var ROM = {};
"あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ゔvu ぁa ぃi ぅu ぇe ぉo".split(" ").forEach(function(t){ ROM[t.charAt(0)] = t.slice(1); });
var SMALL = {"ゃ":"a","ゅ":"u","ょ":"o"};
var KANA_ONLY = /^[ぁ-ゖー゛゜ァ-ヺヽヾ・]+$/;
var SAFE_TEXT = /^[ぁ-ゖー゛゜ァ-ヺヽヾ・A-Za-z0-9\s\u3000]+$/;
function kanaToRomaji(src){
  var s = String(src).replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); });
  var out = "", sokuon = false;
  for(var i = 0; i < s.length; i++){
    var c = s.charAt(i), r = "";
    if(c === "\u3000" || /\s/.test(c)){ out += " "; sokuon = false; continue; }
    if(/[A-Za-z0-9]/.test(c)){ out += c; sokuon = false; continue; }
    if(c === "っ"){ sokuon = true; continue; }
    if(c === "ー"){ var m = out.match(/[aiueo]$/i); if(m) out += m[0]; continue; }
    if(!ROM[c]) continue;
    r = ROM[c];
    var nx = s.charAt(i + 1);
    if(SMALL[nx] && /i$/.test(r)){
      r = (r === "shi" || r === "chi" || r === "ji") ? r.slice(0, -1) + SMALL[nx] : r.slice(0, -1) + "y" + SMALL[nx];
      i++;
    }
    if(sokuon){
      r = (r.indexOf("ch") === 0 ? "t" : r.charAt(0)) + r;
      sokuon = false;
    }
    out += r;
  }
  return out.replace(/\s+/g, " ").toUpperCase();
}
function romajiFromSegs(){
  var kana = "";
  for(var i = 0; i < S.nameSeg.length; i++){
    var k = S.nameSeg[i].k;
    if(k === null || k === "") return null;
    kana += k;
  }
  var r = kanaToRomaji(kana).replace(/^ +/, "");
  var trailing = / $/.test(r);
  var words = r.trim().split(" ").filter(Boolean);
  /* 日本語の名前は、英語の並び（名 姓）に入れ替える */
  if(words.length >= 2 && /[^\x00-\x7F]/.test(S.name)) words.reverse();
  var out = words.join(" ");
  return (trailing && out) ? out + " " : out;
}

  };

var S = freshState();

function val(arr, fb){ return arr.length ? arr[0] : fb; }
function statName(k){ return STAT_MAP[k] || k; }
function starStr(n){ return "★".repeat(n) + "☆".repeat(Math.max(0, 5 - n)); }
function countStars(t){ return (String(t).match(/★/g) || []).length; }

function buildCands(kept, lastName){
  var used = [].concat(S.attrs, S.ability, S.move, S.hidden, S.likes, S.equip, S.heal, S.save, [lastName]);
  function conflict(n){
    return used.some(function(u){
      if(!u) return false;
      if(u === n) return true;
      return u.length >= 3 && n.length >= 3 && (n.indexOf(u) >= 0 || u.indexOf(n) >= 0);
    }) || kept.indexOf(n) >= 0;
  }
  var cands = [];
  function push(n){ if(n && cands.indexOf(n) < 0 && !conflict(n)) cands.push(n); }
  S.attrs.forEach(function(a){ push(statName(a)); });
  S.likes.forEach(function(a){ push(statName(a)); });
  STAT_FILL.forEach(function(f){ push(f); });
  return cands;
}
/* 追加ボタンを押したときの、自動の項目名（すでにある項目とは重ならない） */
function suggestStatName(){
  ensureStats();
  var kept = [];
  S.statRows.forEach(function(r){ kept.push(r.name); });
  S.extraRows.forEach(function(r){ kept.push(r.name); });
  return buildCands(kept, S.last.name)[0] || "";
}
function ensureStats(){
  var sig = JSON.stringify([S.attrs, S.ability, S.move, S.hidden, S.likes]);
  if(sig === S.sig && S.statRows.length) return;
  S.sig = sig;
  var hid = val(S.hidden, "かなり負けず嫌い");
  var lastInfo = lastFor(hid);
  var lastName = lastInfo.name;
  /* 手入力した項目は残し、まだ触っていない項目だけ作り直す */
  var old = S.statRows;
  var kept = [];
  old.forEach(function(r){ if(r.edited) kept.push(r.name); });
  S.extraRows.forEach(function(r){ if(r.edited) kept.push(r.name); });
  if(S.last.edited) kept.push(S.last.name);
  var cands = buildCands(kept, lastName), ci = 0;
  var rows = [];
  for(var i = 0; i < 2; i++){
    if(old[i] && old[i].edited){ rows.push(old[i]); }
    else { rows.push({name: cands[ci++] || "", n: 3, edited: false}); }
  }
  S.statRows = rows;
  S.extraRows.forEach(function(r){ if(!r.edited) r.name = cands[ci++] || ""; });
  if(!S.last.edited){
    S.last = {name:lastName, text:lastInfo.text, edited:false};
  }
}

/* ---------- widgets ---------- */
function chipGroup(key, max, onPick, noInput, liveText){
  var wrap = h("div");
  var chipsEl = h("div", {class:"chips"});
  var input = h("input", {type:"text", class:"chipin", placeholder:"自由に書く", "aria-label":"自由に書く"});
  var addBtn = h("button", {class:"btn ghost small", type:"button", text:"追加"});
  input.value = liveText ? (S[key][0] || "") : (S.draft[key] || "");
  var ex = S.extra;
  if(!ex[key]) ex[key] = [];
  function options(){ return OPT[key].concat(ex[key]); }
  function pick(opt, isPreset){
    var cur = S[key], i = cur.indexOf(opt);
    if(i >= 0){ cur.splice(i,1); }
    else if(max === 1){ S[key] = [opt]; }
    else if(cur.length < max){ cur.push(opt); }
    else { toast("最大" + max + "個までです"); return; }
    draw();
    if(onPick && max === 1 && isPreset && S[key].length) onPick();
  }
  function draw(){
    chipsEl.textContent = "";
    var presetCount = OPT[key].length;
    options().forEach(function(o, idx){
      var on = S[key].indexOf(o) >= 0;
      chipsEl.append(h("button", {class:"chip", type:"button", "aria-pressed": on ? "true" : "false", text:o,
        onclick:function(){ pick(o, idx < presetCount); if(liveText) input.value = S[key][0] || ""; }}));
    });
  }
  if(liveText){
    input.addEventListener("input", function(){
      var v = input.value.trim();
      S[key] = v ? [v] : [];
    });
  } else {
    input.addEventListener("input", function(){ S.draft[key] = input.value; });
    function add(){
      var v = input.value.trim();
      if(!v) return;
      if(options().indexOf(v) < 0) ex[key].push(v);
      input.value = ""; S.draft[key] = "";
      if(S[key].indexOf(v) < 0){
        if(max === 1) S[key] = [v];
        else if(S[key].length < max) S[key].push(v);
        else toast("最大" + max + "個までです");
      }
      draw();
    }
    addBtn.addEventListener("click", add);
    input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); add(); } });
  }
  draw();
  if(!noInput){
    wrap.append(liveText ? h("div", {class:"add"}, input) : h("div", {class:"add"}, input, addBtn));
  }
  wrap.append(chipsEl);
  return wrap;
}
function sectionedChipGroup(key, sections, defaultMax){
  var wrap = h("div");
  var input = h("input", {type:"text", class:"chipin", placeholder:"自由に書く", "aria-label":"自由に書く"});
  var addBtn = h("button", {class:"btn ghost small", type:"button", text:"追加"});
  input.value = S.draft[key] || "";
  input.addEventListener("input", function(){ S.draft[key] = input.value; });
  var ex = S.extra;
  if(!ex[key]) ex[key] = [];
  var allPreset = [];
  sections.forEach(function(sec){ allPreset = allPreset.concat(sec[1]); });
  var body = h("div");
  function sectionOf(opt){
    for(var i = 0; i < sections.length; i++){ if(sections[i][1].indexOf(opt) >= 0) return sections[i]; }
    return null;
  }
  function pick(opt){
    var cur = S[key], i = cur.indexOf(opt);
    if(i >= 0){ cur.splice(i,1); draw(); return; }
    var sec = sectionOf(opt);
    var max = (sec && sec[2] !== undefined) ? sec[2] : defaultMax;
    if(max === 1){
      if(sec){ var items = sec[1]; S[key] = cur.filter(function(v){ return items.indexOf(v) < 0; }); }
      S[key].push(opt);
    } else {
      var countInSec = sec ? cur.filter(function(v){ return sec[1].indexOf(v) >= 0; }).length : cur.length;
      if(countInSec < max){ cur.push(opt); } else { toast("最大" + max + "個までです"); return; }
    }
    draw();
  }
  function chipsFor(items){
    var el = h("div", {class:"chips"});
    items.forEach(function(o){
      var on = S[key].indexOf(o) >= 0;
      el.append(h("button", {class:"chip", type:"button", "aria-pressed": on ? "true" : "false", text:o,
        onclick:function(){ pick(o); }}));
    });
    return el;
  }
  function draw(){
    body.textContent = "";
    sections.forEach(function(sec){
      body.append(h("div", {class:"group-title"}, sec[0]), chipsFor(sec[1]));
    });
    if(ex[key].length) body.append(chipsFor(ex[key]));
  }
  function add(){
    var v = input.value.trim();
    if(!v) return;
    if(allPreset.indexOf(v) < 0 && ex[key].indexOf(v) < 0) ex[key].push(v);
    input.value = ""; S.draft[key] = "";
    if(S[key].indexOf(v) < 0){
      if(defaultMax === 1) S[key] = [v];
      else if(S[key].length < defaultMax) S[key].push(v);
      else toast("最大" + defaultMax + "個までです");
    }
    draw();
  }
  addBtn.addEventListener("click", add);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); add(); } });
  draw();
  wrap.append(h("div", {class:"add"}, input, addBtn), body);
  return wrap;
}
function starsRow(getN, setN, max){
  var box = h("div", {class:"stars", role:"group"});
  function draw(){
    box.textContent = "";
    var n = getN();
    for(var i = 1; i <= max; i++){
      (function(i){
        box.append(h("button", {class:"star" + (i <= n ? " on" : ""), type:"button",
          "aria-label": i + "個", text:"★", onclick:function(){ setN(i); draw(); }}));
      })(i);
    }
  }
  draw();
  return {el:box, redraw:draw};
}

          nm.value = row.name;
          nm.addEventListener("input", function(){ row.name = nm.value; row.edited = true; });
          var del = h("button", {class:"btn ghost small", type:"button", text:"削除", "aria-label":"この項目を削除",
            onclick:function(){ S.extraRows.splice(i, 1); drawExtra(); }});
          var r = starsRow(function(){ return row.n; }, function(n){ row.n = n; row.edited = true; }, 5);
          extraBox.append(h("div", {class:"stat"}, h("div", {class:"r"}, nm, del), r.el));
        });
        var left = 2 - S.extraRows.length;
        addBtn.textContent = left > 0 ? "＋ 項目を追加（あと" + left + "つ）" : "追加は2つまで";
        addBtn.disabled = left <= 0;
      }
      addBtn.addEventListener("click", function(){
        if(S.extraRows.length < 2){ S.extraRows.push({name:suggestStatName(), n:3, edited:false}); drawExtra(); }
      });
      drawExtra();

      var ln = h("input", {type:"text", "aria-label":"最後の項目名"});
      ln.value = S.last.name;
      ln.addEventListener("input", function(){ S.last.name = ln.value; S.last.edited = true; });
      var ta = h("textarea", {class:"wide", "aria-label":"最後の項目の数値", rows:"3",
        placeholder:"例：★★★★★★★★★ ／ 測定不能 ／ ∞"});
      ta.value = S.last.text;
      var box = h("div", {class:"stars", role:"group"});
      function drawLast(){
        box.textContent = "";
        var n = countStars(ta.value);
        for(var i = 1; i <= 7; i++){
          (function(i){
            box.append(h("button", {class:"star" + (i <= n ? " on" : ""), type:"button", "aria-label": i + "個", text:"★",
              onclick:function(){
                ta.value = i >= 5 ? "★".repeat(i) : starStr(i);
                S.last.text = ta.value; S.last.edited = true; drawLast();
              }}));
          })(i);
        }
      }
      ta.addEventListener("input", function(){ S.last.text = ta.value; S.last.edited = true; drawLast(); });
      drawLast();
      var lastBox = h("div", {class:"lastbox"},
        h("div", {class:"ttl"}, "最後の項目は「限界突破」枠"),
        ln, box,
        h("label", {class:"f", for:"lastv"}, "数値の表示（自由に入力できます）"),
        ta,
        h("p", {class:"hint"}, "★は7個までタップで入力できます。入力欄は自由に書き換えできます。星を増やす、「測定不能」「∞」などの言葉を入れる、改行して複数行にするのもOKです。"));
      ta.id = "lastv";
      return h("div", {}, list, extraBox, h("div", {class:"row"}, addBtn), lastBox,
        h("p", {class:"hint"}, "前の質問の答えを変えても、手入力した項目はそのまま残ります。"));
    }
  },
  {
    title:"自分らしさを表すアイテムは？", sub:"",
    validate:function(){ return S.equip.some(function(v){ return v.trim(); }); },
    message:"アイテムを1つ入力してください",
    build:function(next){
      S.equip = S.equip.slice(0, 2);
      if(!S.equip.length) S.equip = [""];
      var box = h("div");
      var addBtn = h("button", {class:"btn ghost small", type:"button", text:"＋ もう1つ追加"});
      function draw(){
        box.textContent = "";
        S.equip.forEach(function(v, i){
          var inp = h("input", {type:"text", autocomplete:"off", "aria-label":"アイテム" + (i + 1),
            placeholder:"書く"});
          inp.value = v;
          inp.addEventListener("input", function(){ S.equip[i] = inp.value; });
          inp.addEventListener("keydown", function(e){
            if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); if(i === S.equip.length - 1) next(); }
          });
          var del = i > 0 ? h("button", {class:"btn ghost small", type:"button", text:"削除", "aria-label":"このアイテムを削除",
            onclick:function(){ S.equip.splice(i, 1); draw(); }}) : null;
          box.append(h("div", {class:"add"}, inp, del));
        });
        addBtn.style.display = S.equip.length >= 2 ? "none" : "";
      }
      addBtn.addEventListener("click", function(){ if(S.equip.length < 2){ S.equip.push(""); draw(); } });
      draw();
      return h("div", {}, box, addBtn, h("p", {class:"hint"}, "1つ必須・最大2つまで入力できます。"));
    }
  },
  {
    title:"疲れたとき、心や体を回復するアイテムは？", sub:"1つ必須・最大2つまで追加できます。",
    build:function(){ return chipGroup("heal", 2); }
  },
  {
    title:"あなたの心が動く場所は？", sub:"楽しい、ほっとする、気分転換、休憩スポット、思い出の場所など、何でもOK。1つ必須・最大2つまで追加できます。",
    build:function(){ return chipGroup("save", 2); }
  },
  {
    title:"あなたが大切にしている思いは？", sub:"",
    build:function(){ return chipGroup("persona", 1); }
  },
  {
    title:"どんな人生にしたい？", sub:"",
    build:function(){ return chipGroup("goal", 1, null, false, true); }
  },
  {
    title:"座右の銘、ゲームへの意気込み、決めゼリフなど何でも書いて！", sub:"",
    validate:function(){ return S.closing.trim() !== ""; },
    message:"決めゼリフを入力してください",
    build:function(next){
      var inp = h("input", {type:"text", "aria-label":"決めゼリフ", placeholder:"自由に書く"});
      inp.value = S.closing;
      inp.addEventListener("input", function(){ S.closing = inp.value; });
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); next(); } });
      var chips = h("div", {class:"chips"});
      OPT.closing.forEach(function(c){
        chips.append(h("button", {class:"chip", type:"button", text:c,
          onclick:function(){ inp.value = c; S.closing = c; }}));
      });
      return h("div", {}, inp, h("div", {class:"group-title"}, "候補（タップで入力欄に入ります）"), chips);
    }
  },
  {
    title:"キャラのビジュアルは？", sub:"立ち絵のイメージ。",
    build:function(){
      return h("div", {},
        h("div", {class:"group-title lg"}, "性別"), chipGroup("gender", 1, null, true),
        h("div", {style:"height:14px"}),
        h("div", {class:"group-title lg"}, "ビジュアル"),
        sectionedChipGroup("look", LOOK_SECTIONS, 1));
    }
  },
  {
    title:"好きな世界観は？", sub:"舞台だけ選べば次に進めます。舞台・色・雰囲気はいくつでも、色のトーンは1つまで追加できます。",
    build:function(){
      return h("div", {},
        h("div", {class:"group-title lg"}, "舞台"), chipGroup("stage", 99),
        h("div", {class:"group-title lg"}, "色"), sectionedChipGroup("colortone", COLOR_TONE_SECTIONS, 99),
        h("div", {class:"group-title lg"}, "雰囲気"), chipGroup("mood", 99));
    }
  }
];

/* すべての質問で、1つは選ぶか入力しないと先に進めない */
var RULES = {
  "あなたの名前は？":[function(){ return S.name.trim() !== ""; }, "名前を入力してください"],
  "あなたを表すキーワードは？":[function(){ return S.attrs.length > 0; }, "1つ以上選ぶか、自分で書いてください"],
  "得意なことは？":[function(){ return S.ability.length > 0 && S.move.length > 0; }, "特殊能力を1つ、必殺技を1〜2つ選ぶか自分で書いてください"],
  "ふだんは見せない意外な一面は？":[function(){ return S.hidden.length > 0; }, "1つ選ぶか、自由に書いてください"],
  "好きなことは？":[function(){ return S.likes.length > 0; }, "1つ以上選ぶか、自分で書いてください"],
  "能力値をつけよう":[function(){
    ensureStats();
    return S.statRows.every(function(r){ return r.name.trim(); }) && S.last.name.trim() !== "" && S.last.text.trim() !== "";
  }, "項目名と、最後の項目の数値を入力してください"],
  "疲れたとき、心や体を回復するアイテムは？":[function(){ return S.heal.length > 0; }, "1〜2個選ぶか、自分で書いてください"],
  "あなたの心が動く場所は？":[function(){ return S.save.length > 0; }, "1〜2個選ぶか、自分で書いてください"],
  "あなたが大切にしている思いは？":[function(){ return S.persona.length > 0; }, "1つ選ぶか、自分で書いてください"],
  "どんな人生にしたい？":[function(){ return S.goal.length > 0; }, "1つ選ぶか、自分で書いてください"],
  "決めゼリフを入れよう":[function(){ return S.closing.trim() !== ""; }, "決めゼリフを入力してください"],
  "好きな世界観は？":[function(){ return S.stage.length > 0; }, "舞台を1つ選んでください"],
  "キャラのビジュアルは？":[function(){ return S.look.length > 0; }, "1つ選ぶか、自分で書いてください"]
};
STEPS.forEach(function(st){
  var r = RULES[st.title];
  if(r && !st.validate){ st.validate = r[0]; st.message = r[1]; }
});

var idx = 0;
var main = document.getElementById("main");
var progress = document.getElementById("progress");

function drawProgress(){
  progress.textContent = "";
  for(var i = 0; i < STEPS.length; i++){
    progress.append(h("i", {class:(i <= idx ? "on" : "") + (i === idx ? " now" : ""), text:"✦"}));
  }
  progress.append(h("span", {text:(idx + 1) + " / " + STEPS.length}));
}
function go(n){ idx = n; render(); window.scrollTo({top:0}); }
function next(){
  var st = STEPS[idx];
  if(st.validate && !st.validate()){
    var pending = Array.prototype.some.call(main.querySelectorAll("input.chipin"), function(el){ return el.value.trim() !== ""; });
    toast(pending ? "入力欄の右にある「追加」を押してください" : (st.message || "入力してください"));
    return;
  }
  if(idx < STEPS.length - 1) go(idx + 1); else showResult();
}

function render(){
  var st = STEPS[idx];
  drawProgress();
  main.textContent = "";
  var body = st.build(next);
  function makeNav(){
    return h("div", {class:"nav"},
      idx > 0 ? h("button", {class:"btn ghost", type:"button", text:"戻る", onclick:function(){ go(idx - 1); }}) : null,
      h("button", {class:"btn next", type:"button", text: idx === STEPS.length - 1 ? "結果を見る" : "次へ", onclick:next}));
  }
  main.append(h("section", {class:"card"},
    h("h2", {text:st.title, class: st.sub ? "" : "nosub"}), st.sub ? h("p", {class:"sub", text:st.sub}) : null, body,
    st.auto ? h("p", {class:"hint", text:"選ぶと自動で次に進みます。"}) : null,
    makeNav()));
}

/* ---------- generation ---------- */
function statLines(indent){
  ensureStats();
  var out = [];
  S.statRows.forEach(function(r){ out.push(indent + (r.name.trim() || "項目") + "　" + starStr(r.n)); });
  S.extraRows.forEach(function(r){ if(r.name.trim()) out.push(indent + r.name.trim() + "　" + starStr(r.n)); });
  out.push(indent + (S.last.name.trim() || "限界突破") + "　" + S.last.text);
  return out;
}
function itemLines(indent){
  var out = [];
  var eq = S.equip.map(function(v){ return v.trim(); }).filter(Boolean);
  if(eq.length) out.push(indent + "【装備・強化】" + eq.join("、"));
  if(S.heal.length) out.push(indent + "【回復アイテム】" + S.heal.join("、"));
  if(S.save.length) out.push(indent + "【セーブポイント】" + S.save.join("、"));
  return out;
}
function labelLine(label, value){
  var W = 7; /* 「隠しステータス」の文字数に合わせて、項目名の長さを揃える */
  return "・" + label + "　".repeat(Math.max(0, W - label.length)) + "｜" + value;
}
function buildGuide(){
  var name = S.name.trim() || "名もなき主人公";
  var attrs = S.attrs.length ? S.attrs : ["自由","探究"];
  var ability = val(S.ability, OPT.ability[0]);
  var moves = S.move.length ? S.move : [OPT.move[0]];
  var hidden = val(S.hidden, OPT.hidden[0]);
  var persona = val(S.persona, OPT.persona[0]);
  var goal = val(S.goal, OPT.goal[0]);
  var likes = S.likes.length ? S.likes : ["読書","散歩"];
  var stage = val(S.stage, OPT.stage[0]);
  var vibeAll = [].concat(S.colortone, S.mood);
  var worldLabel = stage + (vibeAll.length ? "×" + vibeAll.join("×") : "");

  var L = [];
  L.push("🌌 " + name);
  L.push("――キャラクター攻略ガイド");
  L.push("");
  L.push("分類：人間／" + worldLabel + "の住人");
  L.push("属性：" + attrs.join("・"));
  L.push("特殊能力：" + ability);
  L.push("必殺技：" + moves.join("／"));
  L.push("隠しステータス：" + hidden);
  L.push("");
  L.push("🎮 CHARACTER STATUS");
  statLines("").forEach(function(s){ L.push(s); });
  if(isOver(S.last.text)) L.push("※最後だけ上限突破。");
  itemLines("").forEach(function(s){ L.push(s); });
  L.push("");
  L.push("🧠 性格");
  L.push("「" + persona + "」");
  L.push("それが、このキャラクターの行動原理。");
  L.push("");
  L.push("🔮 趣味・創作");
  L.push(likes.join("、") + "が好き。");
  L.push("好きなものに囲まれると、だいたい元気になる。");
  L.push("");
  L.push("⚔️ 必殺技の解説");
  var texts = [], generic = false;
  moves.forEach(function(m){ if(MOVE_TEXT[m]) texts.push(MOVE_TEXT[m]); else generic = true; });
  if(generic) texts.push("発動すると、状況が一気に動き出す。\n本人にとっても意外な威力。");
  L.push(texts.join("\n\n"));
  L.push("");
  var hd = HIDDEN_TEXT[hidden];
  L.push("🔥 隠しスキル：" + (hd ? hd.t : "「本領発揮」"));
  L.push(hd ? hd.b : "ふだんは表に出ないが、条件がそろうと発動する。\nそれもこのキャラクターの魅力のひとつ。");
  L.push("");
  L.push("🏆 QUEST CLEAR");
  L.push("社会にうまく適応することではなく、");
  L.push(goal + "を、自分のやり方で作る。");
  L.push("");
  L.push("💬 決めゼリフ");
  L.push(S.closing.trim());
  return L.join("\n");
}

function buildImagePrompt(compact){
  var name = S.name.trim() || "名もなき主人公";
  var yomi = S.yomi.trim();
  var attrs = S.attrs.length ? S.attrs : ["自由","探究"];
  var stage = val(S.stage, OPT.stage[0]);
  var vibeText = [].concat(S.colortone, S.mood).join("・");
  var worldLabel = stage + (vibeText ? "×" + vibeText : "");
  var style = stage + "を舞台に" + (vibeText ? "、" + vibeText + "を感じる配色・雰囲気でまとめる。" : "、世界観に合う配色でまとめる。");
  var gender = val(S.gender, "");
  var look = (gender ? gender + "・" : "") + val(S.look, "現代のカジュアル服");
  var goal = val(S.goal, OPT.goal[0]);
  var persona = val(S.persona, OPT.persona[0]);
  var moves = S.move.length ? S.move : [OPT.move[0]];
  var hidden = val(S.hidden, OPT.hidden[0]);
  var ability = val(S.ability, OPT.ability[0]);
  var likes = S.likes.length ? S.likes : ["読書","散歩"];
  var closing = S.closing.trim();

  var t = [];
  t.push("ゲームのキャラクター紹介カード風の、縦長（3:4）の高品質なイラストを作成してください。繊細なアニメ調で、設定資料集のような仕上がりにします。");
  t.push("");
  t.push("【世界観・配色】" + worldLabel + "。" + style);
  t.push("【キャラクター】" + look + "の人物（" + name + "をイメージ）。左上に大きく立ち絵を配置。世界観に合う小物を持たせる。");
  t.push("【レイアウト】最上部の細い帯にタイトル。その下：左に立ち絵、右に名前と基本情報。" + (yomi ? "名前の真下に、ローマ字を名前より小さい文字で添える。" : "") + "基本情報の項目名（属性・特殊能力・必殺技・隠しステータス）は、すべて同じ長さ・同じ幅のラベル装飾（細い枠や帯）に入れて縦にきれいに揃え、内容は「｜」の右側に並べる。項目名ごとに装飾の長さを変えない。"
    + "中段左：「CHARACTER STATUS」の枠（能力値と、【装備・強化】【回復アイテム】【セーブポイント】の項目。これらの項目名も同じ長さのラベルに揃える）。"
    + (compact ? "下段：「QUEST CLEAR」のカード。" : "中段右：性格・趣味のカード。下段：「QUEST CLEAR」のカード。")
    + (closing ? "最下部の中央に、文字リストの最後にある一行の言葉を大きめに入れる。" : "")
    + "すべて角丸の枠、細い金属調のライン、星や結晶の装飾でまとめる。");
  t.push("");
  t.push("【入れる文字】以下の日本語だけを、一字一句この通りに、読みやすい大きさで入れてください。これ以外の文字は入れないでください。同じ文字・同じ項目を二重に入れず、各項目は1回ずつだけ入れます。位置や大きさの指示はレイアウトに書いてあります。「タイトル：」「名前：」「ローマ字：」の項目名は指示用なので入れず、「：」の後ろの文字だけを入れてください。");
  t.push("・タイトル：キャラクター攻略ガイド");
  t.push("・名前：" + name);
  if(yomi) t.push("・ローマ字：" + yomi);
  t.push("・基本情報：");
  t.push(labelLine("属性", attrs.join("・")));
  t.push(labelLine("特殊能力", ability));
  t.push(labelLine("必殺技", moves.join("／")));
  t.push(labelLine("隠しステータス", hidden));
  t.push("・CHARACTER STATUS：");
  statLines("　").forEach(function(s){ t.push(s); });
  itemLines("　").forEach(function(s){ t.push(s); });
  if(!compact){
    t.push("・性格：「" + persona + "」");
    t.push("・趣味：" + likes.join("、"));
  }
  t.push("・QUEST CLEAR：" + goal);
  if(closing) t.push("・" + closing);
  return t.join("\n");
}

/* ---------- result ---------- */
var tab = 0, compact = false;
function showResult(){
  progress.textContent = "";
  progress.append(h("i", {class:"on", text:"✦"}), h("span", {text:"完成！"}));
  main.textContent = "";

  var tOrig = h("textarea", {class:"doc", readonly:"readonly", "aria-label":"画像生成用原文"});
  var tEdit = h("textarea", {class:"doc", "aria-label":"編集スペース"});
  function makePrompt(){
    var text = buildImagePrompt(compact);
    tOrig.value = text;
    tEdit.value = text;
  }
  makePrompt();

  function copyBtn(ta, label){
    return h("button", {class:"btn", type:"button", text:label, onclick:function(){
      if(!ta.value.trim()){ toast("コピーする内容がありません"); return; }
      copyText(ta.value);
    }});
  }
  var segEl = h("div", {class:"seg"}, "文字量：",
    h("button", {class:"chip", type:"button", "aria-pressed":"false", text:"少なめ（崩れにくい）"}),
    h("button", {class:"chip", type:"button", "aria-pressed":"true", text:"ふつう"}));
  var segBtns = segEl.querySelectorAll("button");
  function setCompact(c){
    compact = c;
    segBtns[0].setAttribute("aria-pressed", c ? "true" : "false");
    segBtns[1].setAttribute("aria-pressed", c ? "false" : "true");
    if(tEdit.value === tOrig.value){ makePrompt(); }
    else {
      var text = buildImagePrompt(compact);
      tOrig.value = text;
    }
  }
  segBtns[0].addEventListener("click", function(){ setCompact(true); });
  segBtns[1].addEventListener("click", function(){ setCompact(false); });

  var tip = h("div", {class:"tip"}, "ChatGPTに貼って使います。文字が崩れる場合は文字量を「少なめ」にするか、背景とキャラだけ作って文字はCanvaなどで載せると確実です。");

  var views = [
    h("div", {}, tip, segEl, tOrig,
      h("div", {class:"row"}, copyBtn(tOrig, "画像生成用をコピー"))),
    h("div", {}, tEdit,
      h("div", {class:"row"}, copyBtn(tEdit, "文章をコピー"),
        h("button", {class:"btn ghost", type:"button", text:"原文に戻す", onclick:function(){
          if(tEdit.value !== tOrig.value && !confirm("編集した内容が消えて、原文に戻ります。よろしいですか？")) return;
          tEdit.value = tOrig.value; toast("原文に戻しました");
        }})))
  ];
  var names = ["画像生成用原文","編集スペース"];
  var tabsEl = h("div", {class:"tabs", role:"tablist"});
  var panels = h("div");
  function drawTabs(){
    tabsEl.textContent = "";
    names.forEach(function(n, i){
      tabsEl.append(h("button", {class:"tab", type:"button", role:"tab",
        "aria-selected": i === tab ? "true" : "false", text:n,
        onclick:function(){ tab = i; drawTabs(); }}));
    });
    panels.textContent = "";
    panels.append(views[tab]);
  }
  drawTabs();

  main.append(h("section", {class:"card"},
    h("h2", {text:(S.name.trim() || "名もなき主人公") + " のキャラクター紹介"}),
    h("p", {class:"sub", text:"そのままコピペしても、編集スペースで自由に書きかえてコピペしてもOKです。"}),
    tabsEl, panels,
    h("div", {class:"nav"},
      h("button", {class:"btn ghost", type:"button", text:"回答を直す", onclick:function(){ go(0); }}),
      h("button", {class:"btn ghost next", type:"button", text:"最初からやり直す", onclick:function(){ S = freshState(); tab = 0; compact = false; go(0); }}))));
  window.scrollTo({top:0});
}

render();
})();
</script>
</body>
</html>
